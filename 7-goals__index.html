.row{display:flex;align-items:center;gap:6px}
.t{flex:1;display:flex;align-items:center;gap:6px;min-width:0;font-size:15px}
.t span{line-height:1.25;font-size:13.5px;overflow-wrap:break-word}
.t img{width:24px;height:24px;object-fit:contain}
.t.a{justify-content:flex-start}
.sc{min-width:64px;text-align:center;font-weight:800;font-size:20px;direction:ltr;unicode-bidi:isolate-override}
.st{text-align:center;font-size:12px;margin-top:4px;color:#5b6d65}
.live{color:#d32f2f;font-weight:700}
.live:before{content:"●";margin-inline-end:4px;animation:b 1s infinite}
@keyframes b{50%{opacity:.2}}
.ch{margin-top:4px;font-size:12px;color:#26584a;text-align:center}
.star{border:0;background:none;font-size:20px;color:#bbb;padding:0 2px}
.star.on{color:#ffb300}
.empty,.err{text-align:center;padding:30px 10px;color:#5b6d65}
.err{color:#b71c1c}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;border-top:1px solid #dde;z-index:6;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:12px 4px;border:0;background:none;font-size:14px;color:#5b6d65}
nav button.on{color:#0b3d2e;font-weight:700;border-top:3px solid #0b3d2e}
.card{background:#fff;border-radius:12px;padding:12px;margin-bottom:10px}
.card h3{margin:0 0 8px;font-size:16px}
input.s{width:100%;padding:11px;border:1px solid #cdd8d2;border-radius:10px;font-size:16px}
.btn{display:inline-block;border:0;background:#0b3d2e;color:#fff;padding:10px 16px;border-radius:10px;font-size:15px;margin-top:6px}
.tm{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid #eee}
.tm img{width:24px;height:24px;object-fit:contain}.tm span{flex:1}
.note{font-size:13px;color:#5b6d65;line-height:1.7}
#toast{position:fixed;top:12px;left:12px;right:12px;background:#0b3d2e;color:#fff;padding:14px;border-radius:12px;z-index:20;font-size:16px;display:none;text-align:center;box-shadow:0 4px 14px #0006}

const PRI=[2391,775,700,740,730,720,710,776,20296,21231,18000,3946,715,3918,606,3908,790,786,2395,3922];
// القناة حسب حقوق البث في مصر/المنطقة (مصادر: beIN, UEFA, أخبار حقوق البث). مش مؤكدة لكل مباراة.

const $=s=>document.querySelector(s);
const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const sv=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let view="m",day=0,onlyLive=false,events=[],favs=ld("favs",[]),teams=ld("teams",{}),err="",lastOk=0,timer=null;
const N=window.GoalsNative;
function pad(n){return String(n).padStart(2,"0")}
function ymd(d){return d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())}
function dayDate(o){const d=new Date();d.setDate(d.getDate()+o);return d}
function localKey(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function parse(e){
 const c=e.competitions&&e.competitions[0];if(!c)return null;
 const h=c.competitors.find(x=>x.homeAway==="home")||c.competitors[0],a=c.competitors.find(x=>x.homeAway==="away")||c.competitors[1];
 if(!h||!a)return null;
 const lid=+((e.uid||"").match(/~l:(\d+)/)||[])[1]||0;
 const st=c.status||e.status||{},ty=st.type||{};
 const sc=[...(c.details||[])].filter(d=>d.scoringPlay);
 const last=sc[sc.length-1];
 return{id:e.id,lid,date:new Date(e.date),state:ty.state,name:ty.name,clock:st.displayClock,short:ty.shortDetail,
  h:{id:h.team.id,n:h.team.shortDisplayName||h.team.displayName,logo:h.team.logo,s:+h.score||0},
  a:{id:a.team.id,n:a.team.shortDisplayName||a.team.displayName,logo:a.team.logo,s:+a.score||0},
  scorer:last&&last.athletesInvolved&&last.athletesInvolved[0]?last.athletesInvolved[0].displayName+" "+((last.clock||{}).displayValue||""):""};
}
async function load(){
 try{
  const rs=await Promise.all([-1,0,1].map(o=>fetch("https://site.api.espn.com/apis/site/v2/sports/soccer/all/scoreboard?dates="+ymd(dayDate(o))+"&limit=1000").then(r=>{if(!r.ok)throw new Error(r.status);return r.json()})));
  const j={events:[].concat(...rs.map(x=>x.events||[]))};
  const seen={};j.events=j.events.filter(e=>seen[e.id]?0:(seen[e.id]=1));
  events=(j.events||[]).map(parse).filter(Boolean);
  events.forEach(m=>{teams[m.h.id]={n:m.h.n,logo:m.h.logo};teams[m.a.id]={n:m.a.n,logo:m.a.logo}});
  sv("teams",teams);err="";lastOk=Date.now();
  checkGoals();
 }catch(e){err="مفيش نت أو الخدمة مش متاحة دلوقتي. هحاول تاني."}
 render();schedule();
}
function schedule(){clearTimeout(timer);const live=events.some(m=>m.state==="in");timer=setTimeout(load,live?30000:120000)}
function notify(title,body){
 toast(title+"\n"+body);
 if(navigator.vibrate)navigator.vibrate([200,100,200]);
 try{if(Notification.permission==="granted"&&!N){navigator.serviceWorker&&navigator.serviceWorker.ready.then(r=>r.showNotification(title,{body,icon:"icon-192.png",tag:"g"+Date.now()}))}}catch(e){}
}
function toast(t){const e=$("#toast");e.textContent=t;e.style.whiteSpace="pre-line";e.style.display="block";setTimeout(()=>e.style.display="none",6000)}
function checkGoals(){
 const prev=ld("prev",null);const cur={};
 events.forEach(m=>{if(m.state!=="pre")cur[m.id]=[m.h.s,m.a.s]});
 if(prev){
  events.forEach(m=>{
   const p=prev[m.id];if(!p||m.state==="pre")return;
   [[m.h,m.a,0],[m.a,m.h,1]].forEach(([me,op,i])=>{
    if(!favs.includes(me.id))return;
    const dm=cur[m.id][i]-p[i],dop=cur[m.id][1-i]-p[1-i];
    const res=`${m.h.n} ${m.h.s} - ${m.a.s} ${m.a.n}`;
    if(dm>0)notify("جووول! ⚽ "+me.n+" سجّل",res+(m.scorer?"\n"+m.scorer:""));
    else if(dm<0)notify("اتلغى هدف لـ"+me.n,res);
    if(dop>0)notify("🥅 "+me.n+" استقبل هدف",res);
    else if(dop<0)notify("اتلغى هدف على "+me.n,res);
   });
  });
 }
 sv("prev",{...(prev||{}),...cur});
}
function stat(m){
 if(m.state==="in"){if(m.name==="STATUS_HALFTIME")return'<span class="live">بين الشوطين</span>';return'<span class="live">'+(m.clock||"")+'</span>'}
 if(m.state==="post"){if(/POSTPONED/.test(m.name))return"اتأجلت";if(/CANCEL/.test(m.name))return"اتلغت";return"انتهت"}
 return m.date.toLocaleTimeString("ar-EG",{hour:"numeric",minute:"2-digit"});
}
function card(m){
 const f=favs.includes(m.h.id)||favs.includes(m.a.id);
 const sc=m.state==="pre"?"-":m.a.s+" - "+m.h.s;
 const ch=CH[m.lid];
 const tm=(t)=>`<div class="t"><button class="star ${favs.includes(t.id)?"on":""}" data-t="${t.id}">★</button><img src="${t.logo||""}" alt="" onerror="this.style.visibility='hidden'"><span>${t.n}</span></div>`;
 return`<div class="m ${f?"fav":""}"><div class="row">${tm(m.h)}<div class="sc">${sc}</div>${tm(m.a)}</div><div class="st">${stat(m)}${m.state!=="pre"&&m.scorer&&m.state==="in"?" · آخر هدف: "+m.scorer:""}</div>${ch?`<div class="ch">📺 ${ch} <small>(متوقعة)</small></div>`:""}</div>`;
}
function lgName(id){return AR[id]||LG[id]||"بطولات أخرى"}
function list(arr){
 if(!arr.length)return'<div class="empty">مفيش مباريات هنا.</div>';
 const g={};arr.forEach(m=>(g[m.lid]=g[m.lid]||[]).push(m));
 const ids=Object.keys(g).map(Number).sort((a,b)=>{const fa=g[a].some(m=>favs.includes(m.h.id)||favs.includes(m.a.id)),fb=g[b].some(m=>favs.includes(m.h.id)||favs.includes(m.a.id));if(fa!==fb)return fa?-1:1;const ia=PRI.indexOf(a),ib=PRI.indexOf(b);return(ia<0?99:ia)-(ib<0?99:ib)||lgName(a).localeCompare(lgName(b))});
 return ids.map(id=>`<div class="lg"><span>${lgName(id)}</span></div>`+g[id].sort((a,b)=>a.date-b.date).map(card).join("")).join("");
}
function dayEvents(){const k=localKey(dayDate(day));return events.filter(m=>localKey(m.date)===k)}
function render(){
 $("#upd").textContent=lastOk?"آخر تحديث "+new Date(lastOk).toLocaleTimeString("ar-EG",{hour:"numeric",minute:"2-digit"}):"";
 document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===view));
 const hd=$("#hd"),mn=$("#main");
 if(view==="m"){
  hd.innerHTML=`<div class="days">${["أمس","النهاردة","بكرة"].map((t,i)=>`<button data-d="${i-1}" class="${day===i-1?"on":""}">${t}</button>`).join("")}</div><div class="filt"><button data-fl="0" class="${onlyLive?"":"on"}">الكل</button><button data-fl="1" class="${onlyLive?"on":""}">🔴 لايف دلوقتي</button></div>`;
  let a=dayEvents();if(onlyLive)a=a.filter(m=>m.state==="in");
  mn.innerHTML=(err?`<div class="err">${err}</div>`:"")+(!events.length&&!err?'<div class="empty">بحمّل المباريات...</div>':list(a));
 }else if(view==="f"){
  hd.innerHTML="";
  if(!favs.length)mn.innerHTML='<div class="empty">لسه ما اخترتش فريق.<br>دوس على النجمة ★ جنب أي فريق، أو من الإعدادات.</div>';
  else{const a=events.filter(m=>favs.includes(m.h.id)||favs.includes(m.a.id));mn.innerHTML=(err?`<div class="err">${err}</div>`:"")+list(a)}
 }else{
  hd.innerHTML="";
  const perm=("Notification"in window)?Notification.permission:"na";
  mn.innerHTML=`<div class="card"><h3>فرقي المفضلة</h3>${favs.map(id=>`<div class="tm"><img src="${(teams[id]||{}).logo||""}"><span>${(teams[id]||{}).n||id}</span><button class="star on" data-t="${id}">✕</button></div>`).join("")||'<div class="note">لسه مفيش.</div>'}
  <input class="s" id="q" placeholder="دوّر على فريق (بالإنجليزي)..."><div id="res"></div></div>
  <div class="card"><h3>الإشعارات</h3><div class="note">لما فريقك يسجّل أو يستقبل هدف هييجيلك إشعار.</div>
  <button class="btn" id="perm">فعّل الإشعارات</button> <button class="btn" id="test">جرّب إشعار</button><div class="note" id="pn">${N?"التطبيق بيتابع الماتشات حتى وهو مقفول.":(perm==="granted"?"الإشعارات متفعلة. لازم التطبيق يكون مفتوح (ولو في الخلفية).":"")}</div></div>
  <div class="card"><h3>معلومات مهمة</h3><div class="note">• النتايج من ESPN، وبتتحدّث كل 30 ثانية لما يكون في ماتش شغال. ممكن تتأخر شوية عن التلفزيون.<br>• الدوري المصري مش موجود في المصدر ده.<br>• القنوات الناقلة متوقعة حسب حقوق البث للبطولة في مصر (مش بتتأكد لكل ماتش)، راجع جدول القناة.<br>• الإشعارات وهو مقفول شغالة في نسخة الأندرويد (APK) بس.</div></div>`;
 }
}
document.addEventListener("click",e=>{
 const t=e.target.closest("[data-t]");
 if(t){const id=t.dataset.t;favs=favs.includes(id)?favs.filter(x=>x!==id):[...favs,id];sv("favs",favs);sync();render();return}
 const d=e.target.closest("[data-d]");if(d){day=+d.dataset.d;render();return}
 const f=e.target.closest("[data-fl]");if(f){onlyLive=f.dataset.fl==="1";render();return}
 const n=e.target.closest("nav button");if(n){view=n.dataset.v;render();scrollTo(0,0);return}
 if(e.target.id==="perm"){if(N)N.askPermission();else if("Notification"in window)Notification.requestPermission().then(render);else toast("المتصفح ده مش بيدعم الإشعارات")}
 if(e.target.id==="test")notify("جووول! ⚽ تجربة","فريقك سجّل هدف (ده إشعار تجريبي)");
});
document.addEventListener("input",e=>{
 if(e.target.id!=="q")return;const q=e.target.value.trim().toLowerCase();
 $("#res").innerHTML=q.length<2?"":Object.entries(teams).filter(([i,t])=>t.n.toLowerCase().includes(q)&&!favs.includes(i)).slice(0,8).map(([i,t])=>`<div class="tm"><img src="${t.logo||""}"><span>${t.n}</span><button class="star" data-t="${i}">★</button></div>`).join("")||'<div class="note">مفيش فريق بالاسم ده في مباريات الأيام دي.</div>';
});
function sync(){if(N){try{N.setFavs(JSON.stringify(favs))}catch(e){}}}
if("serviceWorker"in navigator&&location.protocol!=="file:")navigator.serviceWorker.register("sw.js").catch(()=>{});
document.addEventListener("visibilitychange",()=>{if(!document.hidden)load()});
sync();render();load();
</script></body></html>
