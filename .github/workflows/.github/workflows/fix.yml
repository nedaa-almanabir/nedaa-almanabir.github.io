name: fix-names
on: push
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          for f in [0-9]*-*; do [ -f "$f" ] && git mv "$f" "$(echo "$f" | sed -E 's/^[0-9]+-//')"; done
          git rm -q -f .github/workflows/fix.yml
          git config user.name bot
          git config user.email bot@users.noreply.github.com
          git commit -m "Fix file names" || exit 0
          git push
