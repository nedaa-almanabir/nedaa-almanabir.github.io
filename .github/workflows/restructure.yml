name: restructure
on: push
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          shopt -s nullglob
          files=([0-9]*-*)
          if [ ${#files[@]} -eq 0 ]; then exit 0; fi
          git rm -q --ignore-unmatch khutba-*.html sitemap.xml
          for f in "${files[@]}"; do
            n="${f#*-}"
            n="${n//__//}"
            mkdir -p "$(dirname "$n")"
            git mv -f "$f" "$n"
          done
          git config user.name bot
          git config user.email bot@users.noreply.github.com
          git commit -m "Restructure for CMS"
          git push
